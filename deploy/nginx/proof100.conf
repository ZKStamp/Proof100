# Rate-limit zones must exist once in the nginx http context, for example:
# limit_req_zone $binary_remote_addr zone=p100:10m rate=30r/m;
# limit_req_zone $binary_remote_addr zone=p100acct:10m rate=1r/m;

server {
    listen 80;
    server_name proof.zketernity.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name proof.zketernity.app;

    ssl_certificate /etc/letsencrypt/live/proof.zketernity.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proof.zketernity.app/privkey.pem;

    location = /llms.txt {
        alias /var/www/proof100/llms.txt;
        default_type text/plain;
        charset utf-8;
    }

    location = / {
        default_type text/plain;
        return 200 "Proof-100 by Z-TEXT: private, dated proofs of data on the BitcoinZ blockchain (zk-SNARKs). API: /v1/  MCP: /mcp\n";
    }

    location = /v1/account {
        limit_req zone=p100acct burst=3 nodelay;
        proxy_pass http://127.0.0.1:5100/v1/account;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/ {
        limit_req zone=p100 burst=10 nodelay;
        proxy_pass http://127.0.0.1:5100/v1/;
        proxy_read_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /mcp {
        limit_req zone=p100 burst=10 nodelay;
        proxy_pass http://127.0.0.1:5100/mcp;
        proxy_read_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
